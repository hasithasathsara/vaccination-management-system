<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{inventory/layout}">
<head>
    <title>Hospital Request Management</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Flash banners -->
    <div class="flash-banner success" id="flashBanner" th:if="${successMessage}">
        <span th:text="${successMessage}">Success</span>
    </div>
    <div class="flash-banner error" id="flashBanner" th:if="${errorMessage}">
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <input type="text" id="requestSearch" class="search-input" data-table-target="requestTable"
               placeholder="Search by hospital or vaccine...">
    </div>

    <!-- Requests table -->
    <div class="panel">
        <table class="data-table" id="requestTable" th:if="${not #lists.isEmpty(requests)}">
            <thead>
            <tr>
                <th>Hospital</th>
                <th>Vaccine</th>
                <th>Requested</th>
                <th>Dispatched</th>
                <th>Status</th>
                <th>Requested On</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${requests}">
                <td th:text="${r.hospital.name}">Hospital</td>
                <td th:text="${r.vaccine.brandName}">Vaccine</td>
                <td th:text="${r.requestedQuantity}">0</td>
                <td th:text="${r.dispatchedQuantity} ?: '—'">—</td>
                <td>
                    <span class="badge"
                          th:classappend="${r.status.name() == 'DISPATCHED'} ? 'active' : (${r.status.name() == 'REJECTED'} ? 'inactive' : '')"
                          th:text="${r.status}">PENDING</span>
                </td>
                <td th:text="${#temporals.format(r.requestedAt, 'dd MMM yyyy')}">Date</td>
                <td class="actions-cell">
                    <th:block th:if="${r.status.name() == 'PENDING'}">
                        <a th:href="@{/inventory/requests/{id}/dispatch-form(id=${r.requestId})}"
                           class="btn-icon" title="Accept & Dispatch" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">✔</a>
                        <button class="btn-icon" title="Reject"
                                th:onclick="'openModal(\'rejectModal' + ${r.requestId} + '\')'">✖</button>
                    </th:block>
                    <span th:if="${r.status.name() == 'REJECTED'}" style="color:#9ca3af;font-size:12px;"
                          th:text="${r.reason} ?: 'Rejected'">Rejected</span>
                    <span th:if="${r.status.name() == 'DISPATCHED'}" style="color:#9ca3af;font-size:12px;">Resolved</span>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="empty-state" th:if="${#lists.isEmpty(requests)}">
            No stock requests have been submitted yet.
        </p>
    </div>

    <!-- Reject modals, one per pending request -->
    <div class="modal-overlay" th:id="'rejectModal' + ${r.requestId}"
         th:each="r : ${requests}" th:if="${r.status.name() == 'PENDING'}">
        <div class="modal">
            <div class="modal-header">
                <h3>Reject Request</h3>
                <button class="modal-close" th:onclick="'closeModal(\'rejectModal' + ${r.requestId} + '\')'">&times;</button>
            </div>
            <form th:action="@{/inventory/requests/{id}/reject(id=${r.requestId})}" method="post">
                <div style="padding:20px 24px 0;">
                    <p class="modal-note">
                        Rejecting <span th:text="${r.hospital.name}">hospital</span>'s request for
                        <span th:text="${r.requestedQuantity}">0</span> doses of
                        <span th:text="${r.vaccine.brandName}">vaccine</span>. This can't be undone.
                    </p>
                </div>
                <div class="form-group" style="padding:0 24px;">
                    <label>Reason</label>
                    <input type="text" name="reason" placeholder="e.g. Reserved for another district" required>
                </div>
                <div class="modal-footer" style="padding:20px 24px;">
                    <button type="button" class="btn-secondary"
                            th:onclick="'closeModal(\'rejectModal' + ${r.requestId} + '\')'">Cancel</button>
                    <button type="submit" class="btn-danger">Reject Request</button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
