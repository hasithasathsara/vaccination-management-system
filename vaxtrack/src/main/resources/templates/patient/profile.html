<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{patient/layout}">
<head>
    <title>My Profile</title>
</head>
<body>
<div layout:fragment="content">

    <h2 style="margin-bottom:20px;">My Profile</h2>

    <p th:if="${successMessage}" class="flash-banner-public" style="background:#e7f8ee;color:#16a34a;" th:text="${successMessage}">Success</p>
    <p th:if="${errorMessage}" class="flash-banner-public" style="background:#fdeaea;color:#b91c1c;" th:text="${errorMessage}">Error</p>

    <div class="dashboard-panel" style="max-width:560px;margin-bottom:24px;">
        <h3 style="margin-top:0;">Personal Details</h3>
        <form th:action="@{/patient/profile/update}" method="post">

            <div class="form-group-public">
                <label th:text="${patient.idType}">ID Type</label>
                <input type="text" th:value="${patient.idNumber}" disabled style="background:var(--bg-alt);color:var(--text-secondary);">
                <span style="font-size:12px;color:var(--text-secondary);">Your ID can't be changed — it's permanently linked to your vaccination history.</span>
            </div>

            <div class="form-group-public">
                <label>Full Name</label>
                <input type="text" name="fullName" th:value="${patient.fullName}" required>
            </div>

            <div class="form-group-public">
                <label>Age</label>
                <input type="number" name="age" th:value="${patient.age}" min="0" required>
            </div>

            <div class="form-group-public">
                <label>Phone Number</label>
                <input type="text" name="phoneNumber" th:value="${patient.phoneNumber}" required>
            </div>

            <div class="form-group-public">
                <label>Email <span style="color:var(--text-secondary);font-weight:400;">(optional)</span></label>
                <input type="email" name="email" th:value="${patient.email}">
            </div>

            <div class="form-group-public">
                <label>Address <span style="color:var(--text-secondary);font-weight:400;">(optional)</span></label>
                <input type="text" name="address" th:value="${patient.address}">
            </div>

            <div class="form-group-public">
                <label>Disabilities <span style="color:var(--text-secondary);font-weight:400;">(optional)</span></label>
                <input type="text" name="disabilities" th:value="${patient.disabilities}">
            </div>

            <button type="submit" class="btn-hero-primary" style="width:100%;justify-content:center;margin-top:10px;">Save Changes</button>
        </form>
    </div>

    <div class="dashboard-panel" style="max-width:560px;">
        <h3 style="margin-top:0;">Change Password</h3>
        <form th:action="@{/patient/profile/change-password}" method="post">
            <div class="form-group-public">
                <label>Current Password</label>
                <div class="password-wrapper">
                    <input type="password" name="currentPassword" id="currentPassword" required>
                    <img th:src="@{/images/hide.png}" th:data-show-icon="@{/images/show.png}"
                         th:data-hide-icon="@{/images/hide.png}" class="toggle-eye"
                         alt="Toggle password visibility" onclick="togglePw('currentPassword', this)">
                </div>
            </div>
            <div class="form-group-public">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" name="newPassword" id="newPassword" minlength="6" required>
                    <img th:src="@{/images/hide.png}" th:data-show-icon="@{/images/show.png}"
                         th:data-hide-icon="@{/images/hide.png}" class="toggle-eye"
                         alt="Toggle password visibility" onclick="togglePw('newPassword', this)">
                </div>
            </div>
            <div class="form-group-public">
                <label>Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" name="confirmPassword" id="confirmPassword" minlength="6" required>
                    <img th:src="@{/images/hide.png}" th:data-show-icon="@{/images/show.png}"
                         th:data-hide-icon="@{/images/hide.png}" class="toggle-eye"
                         alt="Toggle password visibility" onclick="togglePw('confirmPassword', this)">
                </div>
            </div>
            <button type="submit" class="btn-nav-outline" style="width:100%;">Change Password</button>
        </form>
    </div>

</div>
</body>
</html>
